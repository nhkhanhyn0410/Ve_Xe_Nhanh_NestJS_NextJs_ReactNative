name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  workspace-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shared Types - Build
            build-shared-types: false
            build-api-client: false
            working-directory: packages/shared-types
            command: npm run build
          - name: API Client - Build
            build-shared-types: true
            build-api-client: false
            working-directory: packages/api-client
            command: npm run build
          - name: Frontend - Lint
            build-shared-types: true
            build-api-client: true
            working-directory: apps/frontend
            command: npm run lint
          - name: Frontend - Build
            build-shared-types: true
            build-api-client: true
            working-directory: apps/frontend
            command: npm run build
          - name: Mobile - Typecheck
            build-shared-types: true
            build-api-client: true
            working-directory: apps/mobile
            command: npm run typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        if: matrix.build-shared-types
        run: npm run build
        working-directory: packages/shared-types

      - name: Build api-client
        if: matrix.build-api-client
        run: npm run build
        working-directory: packages/api-client

      - name: Run check
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.working-directory }}

  backend:
    name: Backend - Lint & Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install toan bo monorepo (bao gom shared-types + backend)
      - name: Install dependencies
        run: npm ci

      # Build shared-types truoc (backend depend vao no)
      - name: Build shared-types
        run: npm run build
        working-directory: packages/shared-types

      - name: Run ESLint
        run: npm run lint
        working-directory: apps/backend

      - name: Run tests
        run: npm test -- --passWithNoTests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/vexenhanh_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d

      - name: Build
        run: npm run build
        working-directory: apps/backend
